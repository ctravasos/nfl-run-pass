<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}NFL Run/Pass Tendencies{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><ellipse cx='12' cy='12' rx='10' ry='6.5' transform='rotate(-35 12 12)' fill='%23E8EAED'/><path d='M8.5 15.5l7-7M10 12.5l1.5 1.5M11.5 11l1.5 1.5M13 9.5l1.5 1.5' stroke='%23000' stroke-width='1.2'/></svg>" />
  <link rel="stylesheet" href="{{ base }}/static/css/main.css" />
  {% block head %}{% endblock %}
</head>
<body>
<nav class="navbar">
  <a href="{{ base }}/" class="nav-logo">
    <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="10" ry="6.5" transform="rotate(-35 12 12)" fill="currentColor"/><path d="M8.5 15.5l7-7M10 12.5l1.5 1.5M11.5 11l1.5 1.5M13 9.5l1.5 1.5" stroke="#000" stroke-width="1.2"/></svg>
    <span>NFL Run/Pass Tendencies</span>
  </a>
  <div class="nav-tabs">
    <a href="{{ base }}/" class="nav-tab {{ 'active' if active == 'index' }}">Matchup</a>
    <a href="{{ base }}/about/" class="nav-tab {{ 'active' if active == 'about' }}">How it works</a>
  </div>
  <div class="nav-refresh"><span>Updated</span> {{ updated }}</div>
</nav>
<main class="page-content">
{% block content %}{% endblock %}
</main>
</body>
</html>
